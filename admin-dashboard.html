<!doctype html>
<html lang="id">
<head>
 <script src="config.js"></script>
  <meta charset="utf-8">
  <title>Dashboard Pengurus HC 32</title>
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <script src="config.js"></script>
  <style>
    body { margin:0; font-family:system-ui,-apple-system,"Segoe UI",sans-serif; background:#f1f5f9; }
    .topbar { background:#fff; border-bottom:1px solid #e2e8f0; height:54px; display:flex;align-items:center;justify-content:space-between;padding:0 .8rem;position:sticky;top:0;z-index:50; }
    .logo { display:flex;gap:.5rem;align-items:center; }
    .logo-circle { width:30px;height:30px;border-radius:999px;background:#005A9C;color:#fff;display:flex;align-items:center;justify-content:center;font-weight:700;font-size:.75rem; }
    .wrap { display:flex; }
    .sidebar { width:210px;background:#0f172a;color:#fff;min-height:calc(100vh - 54px);padding:.8rem .6rem;position:sticky;top:54px; }
    .nav { padding:.4rem .5rem;border-radius:.6rem;font-size:.7rem;cursor:pointer;display:flex;gap:.5rem;align-items:center; }
    .nav.active { background:rgba(248,250,252,.1); }
    .main { flex:1;padding:1rem 1rem 5rem 1rem; }
    .card { background:#fff;border-radius:1rem;padding:.8rem 1rem;margin-bottom:.9rem;box-shadow:0 6px 20px rgba(15,23,42,.03); }
    table { width:100%;border-collapse:collapse; }
    th,td { padding:.4rem .4rem;border-bottom:1px solid #e2e8f0;font-size:.67rem; }
    th { background:#f8fafc;text-align:left; }
    .badge { padding:2px 8px;font-size:.6rem;border-radius:999px; }
    .badge-siswa{background:rgba(34,197,94,.15);color:#166534;}
    .badge-guru{background:rgba(14,165,233,.15);color:#0369a1;}
    .badge-alumni{background:rgba(249,115,22,.15);color:#c2410c;}
    .badge-non{background:rgba(148,163,184,.15);color:#475569;}
    footer{background:#06243d;color:#fff;font-size:.6rem;text-align:center;padding:.5rem;position:fixed;bottom:0;left:0;width:100%;}
    @media(max-width:900px){ .sidebar{position:fixed;left:-100%;transition:.2s;} .sidebar.open{left:0;} .wrap{flex-direction:column;} }
  </style>
</head>
<body>
  <div class="topbar">
    <div class="logo">
      <div class="logo-circle">HC</div>
      <div style="line-height:1;">
        <div style="font-weight:600;font-size:.8rem;">Pengurus HC</div>
        <div id="top-meta" style="font-size:.6rem;color:#94a3b8;"></div>
      </div>
    </div>
    <button id="btn-menu" style="background:transparent;border:none;display:none;">
      ☰
    </button>
  </div>

  <div class="wrap">
    <aside class="sidebar" id="sidebar">
      <div style="display:flex;gap:.5rem;align-items:center;margin-bottom:.7rem;">
        <div id="sb-avatar" style="width:34px;height:34px;border-radius:999px;background:rgba(255,255,255,.1);display:flex;align-items:center;justify-content:center;font-weight:600;">HC</div>
        <div>
          <div id="sb-name" style="font-size:.7rem;font-weight:600;">Pengurus</div>
          <div id="sb-role" style="font-size:.6rem;opacity:.6;">-</div>
        </div>
      </div>
      <div class="nav active" data-view="dashboard">📊 Ringkasan & Presensi</div>
      <div class="nav" onclick="window.location.href='admin-agenda.html'">🗓 Agenda</div>
      <div class="nav" onclick="window.location.href='admin-posting.html'">📰 Posting</div>
      <div class="nav" onclick="window.location.href='admin-anggota.html'">👥 Anggota</div>
      <div class="nav" onclick="window.location.href='admin-kepengurusan.html'">🏛 Kepengurusan</div>
      <div class="nav" id="btn-logout">🚪 Keluar</div>
    </aside>

    <main class="main">
      <div class="card">
        <h3 style="margin:0 0 .5rem 0;font-size:.8rem;">Presensi terbaru</h3>
        <div id="dash-presensi">Memuat...</div>
      </div>

      <div class="card">
        <h3 style="margin:0 0 .5rem 0;font-size:.8rem;">Presensi per pertemuan</h3>
        <div style="display:flex;gap:.5rem;margin-bottom:.5rem;">
          <select id="presensi-pertemuan" style="padding:.3rem .4rem;font-size:.7rem;"></select>
          <button id="btn-load-ptm" style="padding:.3rem .7rem;font-size:.7rem;">Tampilkan</button>
          <button id="btn-export" style="padding:.3rem .7rem;font-size:.7rem;">Export CSV</button>
        </div>
        <div style="overflow-x:auto;">
          <table>
            <thead>
              <tr>
                <th>#</th>
                <th>Anggota</th>
                <th>NIS</th>
                <th>Kelas</th>
                <th>Pertemuan</th>
                <th>Waktu</th>
                <th>Tipe</th>
              </tr>
            </thead>
            <tbody id="body-presensi"><tr><td colspan="7">Pilih pertemuan dulu.</td></tr></tbody>
          </table>
        </div>
      </div>
    </main>
  </div>

  <footer>
    © 2025 History Club SMAN 32 Jakarta. Dibuat dan dikembangkan oleh @vitezegi.
  </footer>

  <script>
    // harus login
    const token = hc32_requireLogin();
    const prof  = hc32_getProfile();
    document.getElementById("sb-name").textContent = prof.nama;
    document.getElementById("sb-role").textContent = (prof.tipe||"-") + " • " + (prof.role||"-");
    document.getElementById("sb-avatar").textContent = prof.nama.substring(0,2).toUpperCase();
    document.getElementById("top-meta").textContent = prof.nama;

    // menu hp
    const sb = document.getElementById("sidebar");
    const btnMenu = document.getElementById("btn-menu");
    if (window.innerWidth < 900) btnMenu.style.display = "inline-block";
    btnMenu.addEventListener("click", ()=> sb.classList.toggle("open"));

    // logout
    document.getElementById("btn-logout").onclick = ()=> hc32_logout();

    // presensi dashboard
    loadPresensiDashboard();
    loadPertemuanList();

    async function loadPresensiDashboard() {
      const out = await hc32_post("getPresensiDashboard", { token });
      const wrap = document.getElementById("dash-presensi");
      if (out.status !== "ok") {
        wrap.textContent = "Gagal memuat.";
        return;
      }
      const list = out.data || [];
      let html = '<table><thead><tr><th>Anggota</th><th>NIS</th><th>Kelas</th><th>Pertemuan</th><th>Waktu</th><th>Tipe</th></tr></thead><tbody>';
      list.forEach(item=>{
        const tipe = (item.tipe||"").toLowerCase();
        const badge = tipe==="alumni" ? '<span class="badge badge-alumni">Alumni</span>' :
                      tipe==="guru" ? '<span class="badge badge-guru">Guru</span>' :
                      (tipe==="non-32"||tipe==="non32") ? '<span class="badge badge-non">Non 32</span>' :
                      '<span class="badge badge-siswa">Siswa</span>';
        html += `<tr>
          <td>${item.nama||"-"}</td>
          <td>${item.nis||"-"}</td>
          <td>${item.kelas||"-"}</td>
          <td>${item.pertemuan||"-"}</td>
          <td>${item.timestamp ? new Date(item.timestamp).toLocaleString("id-ID") : item.jam||"-"}</td>
          <td>${badge}</td>
        </tr>`;
      });
      html += "</tbody></table>";
      wrap.innerHTML = html;
    }

    async function loadPertemuanList() {
      const out = await hc32_post("listPertemuan", { token });
      const sel = document.getElementById("presensi-pertemuan");
      sel.innerHTML = "";
      if (out.status !== "ok") { sel.innerHTML = "<option>Gagal</option>"; return; }
      (out.data || []).forEach(ptm=>{
        const o = document.createElement("option");
        o.value = ptm; o.textContent = ptm;
        sel.appendChild(o);
      });
    }

    document.getElementById("btn-load-ptm").addEventListener("click", loadPresensiByPertemuan);

    async function loadPresensiByPertemuan() {
      const ptm = document.getElementById("presensi-pertemuan").value;
      const out = await hc32_post("listPresensiByPertemuan", { token, pertemuan: ptm });
      const tb = document.getElementById("body-presensi");
      tb.innerHTML = "";
      if (out.status !== "ok" || !out.data.length) {
        tb.innerHTML = '<tr><td colspan="7">Tidak ada data.</td></tr>';
        return;
      }
      out.data.forEach((r,i)=>{
        const tipe = (r.tipe||"").toLowerCase();
        const badge = tipe==="alumni" ? '<span class="badge badge-alumni">Alumni</span>' :
                      tipe==="guru" ? '<span class="badge badge-guru">Guru</span>' :
                      (tipe==="non-32"||tipe==="non32") ? '<span class="badge badge-non">Non 32</span>' :
                      '<span class="badge badge-siswa">Siswa</span>';
        const tr = document.createElement("tr");
        tr.innerHTML = `
          <td>${i+1}</td>
          <td>${r.nama||"-"}</td>
          <td>${r.nis||"-"}</td>
          <td>${r.kelas||"-"}</td>
          <td>${r.pertemuan||"-"}</td>
          <td>${r.timestamp ? new Date(r.timestamp).toLocaleString("id-ID") : r.jam||"-"}</td>
          <td>${badge}</td>
        `;
        tb.appendChild(tr);
      });
    }

    // export
    document.getElementById("btn-export").onclick = async ()=>{
      const ptm = document.getElementById("presensi-pertemuan").value;
      if (!ptm) { alert("Pilih pertemuan dulu"); return; }
      const out = await hc32_post("listPresensiByPertemuan", { token, pertemuan: ptm });
      if (out.status !== "ok") { alert("Gagal ambil data"); return; }
      let csv = "Nama,NIS,Kelas,Pertemuan,Waktu,Tipe,Jabatan\n";
      (out.data||[]).forEach(r=>{
        csv += `"${r.nama||""}","${r.nis||""}","${r.kelas||""}","${r.pertemuan||""}","${r.timestamp||r.jam||""}","${r.tipe||""}","${r.roleTag||""}"\n`;
      });
      const blob = new Blob([csv], {type:"text/csv"});
      const url = URL.createObjectURL(blob);
      const a = document.createElement("a");
      a.href = url;
      a.download = "presensi_"+ptm.replace(/\s+/g,"_")+".csv";
      a.click();
      URL.revokeObjectURL(url);
    }
  </script>
</body>
</html>
