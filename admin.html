<!doctype html>
<html lang="id">
<head>
  <meta charset="utf-8" />
  <title>Login Pengurus • HC 32</title>
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <script src="config.js"></script>
  <style>
    body {
      margin: 0;
      font-family: system-ui, -apple-system, "Segoe UI", sans-serif;
      background: #0f172a;
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 20px;
    }
    .box {
      background: white;
      width: 100%;
      max-width: 360px;
      border-radius: 16px;
      padding: 18px 18px 16px 18px;
      box-shadow: 0 12px 40px rgba(0,0,0,.25);
    }
    .logo {
      width: 52px;
      height: 52px;
      border-radius: 999px;
      background: #005A9C;
      color: white;
      display: flex;
      align-items: center;
      justify-content: center;
      font-weight: 700;
      font-size: 20px;
      margin-bottom: 8px;
    }
    h1 { margin: 0; font-size: 1.25rem; }
    p { margin: 0; color: #64748b; font-size: .8rem; margin-bottom: 12px; }
    label { font-size: .7rem; font-weight: 600; display: block; margin-bottom: 3px; }
    input {
      width: 100%;
      border: 1px solid #cbd5e1;
      border-radius: 10px;
      padding: 6px 8px;
      font-size: .8rem;
      margin-bottom: 10px;
    }
    button {
      width: 100%;
      background: #005A9C;
      color: white;
      border: none;
      border-radius: 999px;
      padding: 7px 0;
      font-weight: 600;
      cursor: pointer;
    }
    .msg { font-size: .7rem; margin-top: 8px; }
    footer { text-align: center; margin-top: 10px; font-size: .6rem; color: #94a3b8; }
  </style>
</head>
<body>

  <div class="box" id="login-box">
    <div class="logo">HC</div>
    <h1>Panel Pengurus</h1>
    <p>Masuk dengan NIS / NIP / NISN + password.</p>

    <label for="username">NIS / NIP / NISN</label>
    <input id="username" autocomplete="off" />

    <label for="password">Password</label>
    <input id="password" type="password" />

    <button id="btn-login">Masuk</button>
    <div id="login-msg" class="msg"></div>

    <footer>© 2025 History Club SMAN 32 Jakarta.</footer>
  </div>

  <script>
    // 1) cek apakah ada token di QUERY dari web utama
    const q = hc32_getQuery();
    if (q.token) {
      // simpan ke localStorage
      hc32_saveSession({
        token: q.token,
        username: q.u || "",
        nama: q.n || "",
        role: q.role || "",
        tipe: q.t || ""
      });
      // langsung lempar ke dashboard
      window.location.href = "admin-dashboard.html";
    } else {
      // 2) kalau nggak ada token di URL, cek localStorage
      const existing = hc32_getToken();
      if (existing) {
        window.location.href = "admin-dashboard.html";
      }
    }

    // 3) fallback: login manual
    document.getElementById("btn-login").addEventListener("click", doLogin);
    document.getElementById("password").addEventListener("keyup", e => {
      if (e.key === "Enter") doLogin();
    });

    async function doLogin() {
      const u = document.getElementById("username").value.trim();
      const p = document.getElementById("password").value.trim();
      const msg = document.getElementById("login-msg");
      msg.textContent = "Memeriksa...";
      const out = await hc32_post("loginAdmin", { username: u, password: p });
      if (out.status === "ok") {
        hc32_saveSession(out);
        msg.textContent = "Berhasil. Mengalihkan...";
        window.location.href = "admin-dashboard.html";
      } else {
        msg.textContent = out.message || "Gagal login.";
        msg.style.color = "red";
      }
    }
  </script>
</body>
</html>
