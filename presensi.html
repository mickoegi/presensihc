<!doctype html>
<html lang="id">
<head>
  <meta charset="utf-8">
  <title>Presensi Kegiatan HC 32</title>
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <script src="https://unpkg.com/html5-qrcode"></script>
  <style>
    :root {
      --hc-blue: #005A9C;
    }
    body {
      font-family: system-ui, -apple-system, "Segoe UI", sans-serif;
      background: #e2e8f0;
      margin: 0;
      padding: 16px;
    }
    h1 {
      text-align: center;
      font-size: 28px;
      font-weight: 700;
      color: #0f172a;
      margin-bottom: 18px;
    }
    #qr-box {
      max-width: 520px;
      margin: 0 auto;
    }
    #qr-reader {
      border: 4px dashed var(--hc-blue);
      border-radius: 14px;
      min-height: 120px;
      background: #f8fafc;
      overflow: hidden;
    }
    #manual-box {
      background: #fff;
      max-width: 520px;
      margin: 20px auto 0 auto;
      padding: 16px;
      border-radius: 14px;
      box-shadow: 0 4px 16px rgba(15,23,42,.08);
    }
    #manual-box input {
      width: 100%;
      padding: 10px 12px;
      border: 1px solid #cbd5e1;
      border-radius: 10px;
      font-size: 16px;
      margin-bottom: 12px;
    }
    #manual-box button {
      background: var(--hc-blue);
      color: white;
      border: 0;
      padding: 10px 12px;
      border-radius: 10px;
      font-weight: 600;
      width: 100%;
      cursor: pointer;
    }
    #status-layer {
      position: fixed;
      inset: 0;
      display: flex;
      align-items: center;
      justify-content: center;
      pointer-events: none;
    }
    .bubble {
      width: 150px;
      height: 150px;
      border-radius: 999px;
      display: flex;
      flex-direction: column;
      justify-content: center;
      align-items: center;
      gap: 6px;
      font-weight: 600;
      color: white;
      opacity: 0;
      transform: scale(.4);
      transition: all .25s ease-out;
    }
    .bubble.show { opacity: 1; transform: scale(1); }
    .success { background: #22c55e; }
    .error { background: #ef4444; }
    .bubble span { font-size: 46px; line-height: 1; }
    #popup-nama {
      position: fixed;
      bottom: 30px;
      left: 50%;
      transform: translateX(-50%);
      background: #fff;
      color: #0f172a;
      padding: 14px 22px;
      border-radius: 12px;
      font-size: 16px;
      font-weight: 600;
      box-shadow: 0 6px 20px rgba(0,0,0,0.2);
      opacity: 0;
      transition: all 0.4s ease;
      pointer-events: none;
    }
    #popup-nama.show {
      opacity: 1;
      transform: translateX(-50%) translateY(-10px);
    }
    #last-log {
      text-align: center;
      margin-top: 16px;
      color: #64748b;
      font-size: 14px;
    }
  </style>
</head>
<body>
  <h1>Presensi Kegiatan HC 32</h1>

  <div id="qr-box">
    <div id="qr-reader">Memeriksa kamera...</div>
    <div id="upload-box" style="display:none; text-align:center; margin-top:10px;">
      <p>Kamera tidak aktif? Upload foto barcode:</p>
      <input type="file" id="qr-file" accept="image/*">
    </div>
  </div>

  <div id="manual-box">
    <p style="margin:0 0 6px 0;font-weight:600;">Input NIS manual</p>
    <input type="text" id="nis-input" placeholder="mis. 321005">
    <button id="nis-submit">Kirim Presensi</button>
    <p style="font-size:12px;color:#94a3b8;margin-top:8px;">Gunakan ini jika barcode tidak terbaca.</p>
  </div>

  <div id="last-log"></div>

  <div id="status-layer">
    <div id="bubble-success" class="bubble success">
      <span>✓</span>
      <div>Presensi OK</div>
    </div>
    <div id="bubble-error" class="bubble error">
      <span>✕</span>
      <div>Gagal</div>
    </div>
  </div>

  <div id="popup-nama"></div>

  <!-- Suara notifikasi -->
  <audio id="sound-success" src="https://assets.mixkit.co/active_storage/sfx/2019/2019-preview.mp3"></audio>
  <audio id="sound-error" src="https://assets.mixkit.co/active_storage/sfx/2568/2568-preview.mp3"></audio>

  <script>
    const WEB_APP_URL = "https://script.google.com/macros/s/AKfycbyvTzjW2iQ2qT0Y_Hz1E4I9njAo09FRhnOAnSjtC3zo2HwkgtXQftH_sCiKriqOVXuSOg/exec";

    const soundSuccess = document.getElementById("sound-success");
    const soundError = document.getElementById("sound-error");
    const popupNama = document.getElementById("popup-nama");

    async function kirimPresensi(nis) {
      const res = await fetch(WEB_APP_URL, {
        method: "POST",
        body: JSON.stringify({ action: "presensi", nis })
      });
      return res.json();
    }

    function showSuccess(msg) {
      const b = document.getElementById("bubble-success");
      b.querySelector("div").textContent = msg || "Berhasil";
      b.classList.add("show");
      soundSuccess.play();
      setTimeout(() => b.classList.remove("show"), 1200);
    }
    function showError(msg) {
      const b = document.getElementById("bubble-error");
      b.querySelector("div").textContent = msg || "Gagal";
      b.classList.add("show");
      soundError.play();
      setTimeout(() => b.classList.remove("show"), 1400);
    }
    function setLastLog(text) {
      document.getElementById("last-log").textContent = text;
    }

    // popup nama
    function showPopupNama(nama, nis) {
      popupNama.textContent = `${nama} (${nis})`;
      popupNama.classList.add("show");
      setTimeout(() => popupNama.classList.remove("show"), 2000);
    }

    function handlePresensiResponse(out) {
      if (out.status === "ok") {
        showSuccess("Presensi OK");
        setLastLog("OK: " + (out.nama || "N/A") + " (" + out.nis + ")");
        showPopupNama(out.nama || "Tidak dikenal", out.nis);
      } else if (out.status === "not-registered") {
        showError("NIS belum terdaftar");
        setLastLog("Gagal: NIS belum terdaftar");
      } else if (out.status === "duplicate") {
        showError("Sudah presensi hari ini");
        setLastLog("Gagal: sudah presensi hari ini");
      } else {
        showError(out.message || "Gagal");
        setLastLog("Gagal: " + (out.message || "error"));
      }
    }

    document.getElementById("nis-submit").addEventListener("click", async () => {
      const el = document.getElementById("nis-input");
      const nis = el.value.trim();
      if (!nis) return;
      try {
        const out = await kirimPresensi(nis);
        handlePresensiResponse(out);
      } catch (e) {
        showError("Network");
        setLastLog("Network error");
      } finally {
        el.value = "";
      }
    });

    // === Scanner ===
    const qrReaderDiv = document.getElementById("qr-reader");
    const uploadBox = document.getElementById("upload-box");

    Html5Qrcode.getCameras().then(devices => {
      if (!devices || devices.length === 0) {
        qrReaderDiv.innerHTML = "Kamera tidak tersedia.";
        uploadBox.style.display = "block";
        return;
      }
      const cameraId = devices.find(d => d.label.toLowerCase().includes("back"))?.id || devices[0].id;
      const html5QrCode = new Html5Qrcode("qr-reader");
      html5QrCode.start(
        cameraId,
        { fps: 10, qrbox: 250 },
        async (decodedText) => {
          html5QrCode.pause();
          try {
            const out = await kirimPresensi(decodedText.trim());
            handlePresensiResponse(out);
          } catch (e) {
            showError("Network");
          } finally {
            setTimeout(() => html5QrCode.resume(), 1400);
          }
        }
      ).catch(err => {
        qrReaderDiv.innerHTML = "Kamera tidak dapat digunakan.";
        uploadBox.style.display = "block";
      });

      document.getElementById("qr-file").addEventListener("change", e => {
        if (e.target.files.length === 0) return;
        html5QrCode.scanFile(e.target.files[0], true)
          .then(async decodedText => {
            const out = await kirimPresensi(decodedText.trim());
            handlePresensiResponse(out);
          })
          .catch(() => showError("Gagal baca gambar"));
      });
    }).catch(err => {
      qrReaderDiv.innerHTML = "Kamera tidak tersedia.";
      uploadBox.style.display = "block";
    });
  </script>
</body>
</html>
