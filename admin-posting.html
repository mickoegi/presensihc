<!doctype html>
<html lang="id">
<head>
  <meta charset="utf-8" />
  <title>Posting • Pengurus HC 32</title>
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <script src="config.js"></script>
  <style>
    :root { --hc-blue:#005A9C; --bg:#f1f5f9; }
    *{box-sizing:border-box;}
    body{margin:0;font-family:system-ui,-apple-system,"Segoe UI",sans-serif;background:var(--bg);min-height:100vh;display:flex;}
    .sidebar{width:230px;background:#0f172a;color:white;display:flex;flex-direction:column;position:fixed;inset:0 auto 0 0;z-index:50;transition:.25s;}
    .sidebar-header{padding:14px 16px 10px 16px;display:flex;gap:10px;align-items:center;border-bottom:1px solid rgba(255,255,255,.06);}
    .avatar{width:38px;height:38px;border-radius:999px;background:rgba(255,255,255,.08);display:flex;align-items:center;justify-content:center;font-weight:700;}
    .nav-item{padding:9px 16px;display:flex;gap:8px;align-items:center;cursor:pointer;font-size:.82rem;border-left:3px solid transparent;}
    .nav-item.active{background:rgba(255,255,255,.06);border-left-color:#38bdf8;}
    .nav-item:hover{background:rgba(255,255,255,.03);}
    @media(max-width:900px){.sidebar{transform:translateX(-100%);} .sidebar.open{transform:translateX(0);}}
    .main{flex:1;margin-left:230px;display:flex;flex-direction:column;min-height:100vh;}
    @media(max-width:900px){.main{margin-left:0;}}
    header{background:white;padding:8px 16px;border-bottom:1px solid #e2e8f0;display:flex;justify-content:space-between;align-items:center;position:sticky;top:0;z-index:20;}
    #btn-open-sidebar{display:none;background:white;border:1px solid #cbd5e1;border-radius:6px;width:30px;height:30px;align-items:center;justify-content:center;cursor:pointer;}
    @media(max-width:900px){#btn-open-sidebar{display:inline-flex;}}
    .content{padding:16px 18px 70px 18px;flex:1;}
    .card{background:white;border-radius:14px;padding:14px;box-shadow:0 8px 24px rgba(15,23,42,.03);margin-bottom:14px;}
    .grid2{display:grid;grid-template-columns:1fr 1fr;gap:10px;}
    @media(max-width:700px){.grid2{grid-template-columns:1fr;}}
    .input{width:100%;padding:5px 6px;border:1px solid #cbd5e1;border-radius:6px;font-size:.8rem;}
    .btn{background:var(--hc-blue);color:white;border:none;border-radius:6px;padding:6px 11px;font-size:.75rem;cursor:pointer;}
    .btn-secondary{background:white;border:1px solid #cbd5e1;border-radius:6px;padding:5px 11px;font-size:.7rem;cursor:pointer;}
    table{width:100%;border-collapse:collapse;}
    th,td{padding:6px 6px;border-bottom:1px solid #e2e8f0;font-size:.72rem;}
    th{background:#e2e8f0;text-align:left;}
    footer{background:#06243d;color:white;text-align:center;padding:10px 12px 30px 12px;font-size:.7rem;}
  </style>
</head>
<body>
  <aside class="sidebar" id="sidebar">
    <div class="sidebar-header">
      <div class="avatar">HC</div>
      <div>
        <div id="sb-name">Pengurus</div>
        <div id="sb-role" style="font-size:.65rem;opacity:.6;">-</div>
      </div>
    </div>
    <div class="nav-item" data-link="admin-dashboard.html">📊 Dashboard & Presensi</div>
    <div class="nav-item" data-link="admin-agenda.html">🗓 Agenda</div>
    <div class="nav-item active" data-link="admin-posting.html">📰 Posting</div>
    <div class="nav-item" data-link="admin-anggota.html">👥 Anggota</div>
    <div class="nav-item" data-link="admin-kepengurusan.html">🏛 Kepengurusan</div>
    <div class="nav-item" id="btn-logout">🚪 Keluar</div>
  </aside>

  <div class="main">
    <header>
      <div style="display:flex;gap:10px;align-items:center;">
        <button id="btn-open-sidebar">☰</button>
        <div style="font-weight:600;">Posting Kegiatan</div>
        <div style="font-size:.65rem;color:#94a3b8;">Pengurus HC 32</div>
      </div>
      <div id="top-info" style="font-size:.7rem;color:#64748b;"></div>
    </header>

    <div class="content">
      <div class="card">
        <h2 style="margin-top:0;">Tambah Posting</h2>
        <form id="form-posting" class="grid2">
          <div>
            <label>Judul *</label>
            <input id="po-judul" class="input" required>
          </div>
          <div>
            <label>Tanggal *</label>
            <input id="po-tanggal" type="date" class="input" required>
          </div>
          <div>
            <label>Kategori</label>
            <select id="po-kategori" class="input">
              <option value="hasil-kegiatan">Hasil kegiatan</option>
              <option value="info-gram">Info-gram</option>
              <option value="pengumuman">Pengumuman</option>
            </select>
          </div>
          <div>
            <label>Status</label>
            <select id="po-status" class="input">
              <option value="published">Published</option>
              <option value="draft">Draft</option>
            </select>
          </div>
          <div style="grid-column:1 / span 2;">
            <label>Isi singkat</label>
            <textarea id="po-isi" class="input" rows="2"></textarea>
          </div>
          <div style="grid-column:1 / span 2;">
            <label>URL Gambar (opsi)</label>
            <input id="po-gambar" class="input" placeholder="https://...">
          </div>
          <div style="grid-column:1 / span 2;">
            <button class="btn" type="submit">Simpan Posting</button>
            <span id="po-msg" style="font-size:.7rem;margin-left:8px;"></span>
          </div>
        </form>
      </div>

      <div class="card">
        <h2 style="margin-top:0;">Posting Terbaru</h2>
        <table>
          <thead>
            <tr>
              <th>Tanggal</th>
              <th>Judul</th>
              <th>Kategori</th>
              <th>Status</th>
              <th></th>
            </tr>
          </thead>
          <tbody id="body-posting">
            <tr><td colspan="5">Memuat...</td></tr>
          </tbody>
        </table>
      </div>
    </div>

    <footer>
      © 2025 History Club SMAN 32 Jakarta. Dibuat dan dikembangkan oleh @vitezegi.
    </footer>
  </div>

  <script>
    const token = hc32_getToken();
    if (!token) window.location.href = "admin.html";

    const nm = localStorage.getItem("hc32_admin_nama") || "Pengurus";
    const rl = localStorage.getItem("hc32_admin_role") || "pengurus";
    const tp = localStorage.getItem("hc32_admin_tipe") || "-";
    document.getElementById("sb-name").textContent = nm;
    document.getElementById("sb-role").textContent = tp + " • " + rl;
    document.getElementById("top-info").textContent = nm + " • " + rl;

    const sb = document.getElementById("sidebar");
    document.getElementById("btn-open-sidebar").addEventListener("click", ()=> sb.classList.toggle("open"));

    document.querySelectorAll(".nav-item[data-link]").forEach(i=>{
      i.addEventListener("click", ()=> window.location.href = i.getAttribute("data-link"));
    });
    document.getElementById("btn-logout").addEventListener("click", ()=> hc32_logout());

    async function loadPosting(){
      const out = await hc32_post("listPostingAdmin", { token });
      const tbody = document.getElementById("body-posting");
      tbody.innerHTML = "";
      if (out.status !== "ok" || !out.data.length) {
        tbody.innerHTML = "<tr><td colspan='5'>Belum ada posting.</td></tr>";
        return;
      }
      out.data.forEach(item=>{
        const tr = document.createElement("tr");
        tr.innerHTML = `
          <td>${item.tanggal || '-'}</td>
          <td>
            <b>${item.judul || '-'}</b><br>
            <small>${(item.isi || '').substring(0,70)}</small>
          </td>
          <td>${item.kategori || '-'}</td>
          <td>${item.status || '-'}</td>
          <td><button class="btn-secondary" data-del="${item.id}">Hapus</button></td>
        `;
        tbody.appendChild(tr);
      });

      tbody.querySelectorAll("button[data-del]").forEach(btn=>{
        btn.addEventListener("click", async()=>{
          const id = btn.getAttribute("data-del");
          if (!confirm("Hapus posting ini?")) return;
          const out2 = await hc32_post("deletePosting", { token, id });
          if (out2.status === "ok") loadPosting();
          else alert(out2.message || "Gagal hapus.");
        });
      });
    }

    document.getElementById("form-posting").addEventListener("submit", async e=>{
      e.preventDefault();
      const msg = document.getElementById("po-msg");
      msg.textContent = "Menyimpan...";
      const body = {
        judul: document.getElementById("po-judul").value.trim(),
        tanggal: document.getElementById("po-tanggal").value.trim(),
        kategori: document.getElementById("po-kategori").value,
        isi: document.getElementById("po-isi").value.trim(),
        gambar: document.getElementById("po-gambar").value.trim(),
        status: document.getElementById("po-status").value
      };
      const out = await hc32_post("addPosting", { token, ...body });
      if (out.status === "ok") {
        msg.textContent = "Posting tersimpan.";
        e.target.reset();
        loadPosting();
      } else {
        msg.textContent = out.message || "Gagal.";
      }
    });

    loadPosting();
  </script>
</body>
</html>
