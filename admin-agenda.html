<!doctype html>
<html lang="id">
<head>
  <meta charset="utf-8">
  <title>Kelola Agenda • HC 32</title>
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <style>
    :root{--hc-blue:#005A9C;--bg:#f1f5f9;}
    body{font-family:system-ui,-apple-system,"Segoe UI",sans-serif;background:var(--bg);margin:0;}
    header{background:var(--hc-blue);color:white;padding:14px 18px;display:flex;justify-content:space-between;align-items:center;}
    .brand{font-weight:700;}
    .topbar-user{font-size:12px;}
    .container{max-width:1100px;margin:20px auto;padding:0 16px 40px 16px;}
    h2{margin-bottom:12px;color:#0f172a;}
    form{background:white;padding:14px 14px 10px 14px;border-radius:12px;box-shadow:0 10px 25px rgba(15,23,42,.06);margin-bottom:16px;}
    label{font-size:12px;font-weight:600;display:block;margin-bottom:4px;}
    input,textarea,select{width:100%;padding:7px 8px;border:1px solid #cbd5e1;border-radius:8px;margin-bottom:10px;font-size:13px;}
    button{background:var(--hc-blue);color:white;border:0;border-radius:8px;padding:6px 14px;font-weight:600;cursor:pointer;}
    table{width:100%;border-collapse:collapse;background:white;border-radius:12px;overflow:hidden;box-shadow:0 10px 25px rgba(15,23,42,.06);}
    th,td{padding:8px 10px;font-size:13px;border-bottom:1px solid #e2e8f0;text-align:left;vertical-align:top;}
    th{background:#e2e8f0;font-weight:600;}
    .badge{display:inline-block;padding:2px 8px;border-radius:999px;font-size:11px;}
    .badge-aktif{background:rgba(34,197,94,.15);color:#166534;}
    .badge-selesai{background:rgba(148,163,184,.15);color:#475569;}
    .btn-del{background:#ef4444;border:none;color:white;border-radius:6px;padding:4px 10px;font-size:12px;cursor:pointer;}
    #msg{font-size:13px;margin-bottom:10px;}
    @media(max-width:768px){
      table,thead,tbody,th,td,tr{display:block;}
      th{display:none;}
      td{border-bottom:1px solid #e2e8f0;margin-bottom:8px;}
    }
  </style>
</head>
<body>
  <header>
    <div class="brand">HC 32 • Kelola Agenda</div>
    <div class="topbar-user" id="top-user">Pengurus</div>
  </header>

  <div class="container">
    <h2>Tambah Agenda</h2>
    <form id="form-agenda">
      <div id="msg"></div>
      <label for="judul">Judul kegiatan *</label>
      <input id="judul" required placeholder="Kunjungan Museum Satria Mandala">

      <label for="tanggal">Tanggal (YYYY-MM-DD) *</label>
      <input id="tanggal" type="date" required>

      <label for="waktu">Waktu (opsi)</label>
      <input id="waktu" placeholder="08.00–11.00">

      <label for="tempat">Tempat (opsi)</label>
      <input id="tempat" placeholder="R. Multimedia / Museum ...">

      <label for="deskripsi">Deskripsi (opsi)</label>
      <textarea id="deskripsi" rows="3" placeholder="Ringkasan kegiatan"></textarea>

      <label for="kategori">Kategori</label>
      <select id="kategori">
        <option value="umum">Umum</option>
        <option value="internal">Internal</option>
      </select>

      <label for="status">Status</label>
      <select id="status">
        <option value="aktif">Aktif</option>
        <option value="selesai">Selesai</option>
      </select>

      <button type="submit">Simpan Agenda</button>
    </form>

    <h2>Daftar Agenda</h2>
    <table>
      <thead>
        <tr>
          <th>Tanggal</th>
          <th>Judul</th>
          <th>Tempat</th>
          <th>Kategori</th>
          <th>Status</th>
          <th></th>
        </tr>
      </thead>
      <tbody id="agenda-body">
        <tr><td colspan="6">Memuat...</td></tr>
      </tbody>
    </table>
  </div>

  <script>
    const WEB_APP_URL = "https://script.google.com/macros/s/AKfycbyvTzjW2iQ2qT0Y_Hz1E4I9njAo09FRhnOAnSjtC3zo2HwkgtXQftH_sCiKriqOVXuSOg/exec";

    // ambil token dari query/localStorage
    const url = new URL(window.location.href);
    const qToken = url.searchParams.get("token");
    if (qToken) localStorage.setItem("hc32_admin_token", qToken);
    const token = qToken || localStorage.getItem("hc32_admin_token");
    const nama = localStorage.getItem("hc32_admin_nama") || "";
    document.getElementById("top-user").textContent = nama ? ("Halo, " + nama) : "Pengurus";

    if (!token) {
      alert("Token tidak ada. Buka halaman ini dari tombol Login Pengurus.");
    } else {
      loadAgenda();
    }

    async function loadAgenda() {
      const body = {
        action: "listKegiatanAdmin",
        token: token
      };
      const res = await fetch(WEB_APP_URL, {
        method: "POST",
        body: JSON.stringify(body)
      });
      const out = await res.json();
      const tbody = document.getElementById("agenda-body");
      tbody.innerHTML = "";
      if (out.status !== "ok" || !out.data.length) {
        tbody.innerHTML = "<tr><td colspan='6'>Belum ada agenda.</td></tr>";
        return;
      }
      out.data.forEach(item => {
        const tr = document.createElement("tr");
        tr.innerHTML = `
          <td>${item.tanggal || "-"}</td>
          <td><strong>${item.judul}</strong><br><small>${item.deskripsi || ""}</small></td>
          <td>${item.tempat || "-"}</td>
          <td>${item.kategori || "-"}</td>
          <td>
            ${item.status === "aktif"
              ? "<span class='badge badge-aktif'>Aktif</span>"
              : "<span class='badge badge-selesai'>Selesai</span>"
            }
          </td>
          <td><button class="btn-del" data-id="${item.id}">Hapus</button></td>
        `;
        tbody.appendChild(tr);
      });

      // pasang listener hapus
      document.querySelectorAll(".btn-del").forEach(btn => {
        btn.addEventListener("click", async () => {
          if (!confirm("Hapus agenda ini?")) return;
          const id = btn.getAttribute("data-id");
          const res = await fetch(WEB_APP_URL, {
            method: "POST",
            body: JSON.stringify({ action: "deleteKegiatan", token: token, id: id })
          });
          const out = await res.json();
          if (out.status === "ok") {
            loadAgenda();
          } else {
            alert(out.message || "Gagal hapus");
          }
        });
      });
    }

    document.getElementById("form-agenda").addEventListener("submit", async (e) => {
      e.preventDefault();
      const msg = document.getElementById("msg");
      const judul = document.getElementById("judul").value.trim();
      const tanggal = document.getElementById("tanggal").value.trim();
      const waktu = document.getElementById("waktu").value.trim();
      const tempat = document.getElementById("tempat").value.trim();
      const deskripsi = document.getElementById("deskripsi").value.trim();
      const kategori = document.getElementById("kategori").value;
      const status = document.getElementById("status").value;

      msg.textContent = "Menyimpan...";
      msg.style.color = "#0f172a";

      const res = await fetch(WEB_APP_URL, {
        method: "POST",
        body: JSON.stringify({
          action: "addKegiatan",
          token: token,
          judul, tanggal, waktu, tempat, deskripsi, kategori, status
        })
      });
      const out = await res.json();
      if (out.status === "ok") {
        msg.textContent = "Tersimpan.";
        msg.style.color = "green";
        e.target.reset();
        loadAgenda();
      } else {
        msg.textContent = "Gagal: " + (out.message || "error");
        msg.style.color = "red";
      }
    });
  </script>
</body>
</html>
